[alembic]
# Migration scripts live in the project so that `alembic -c config.ini upgrade head` works
# both locally and in the Docker entrypoint.
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The actual URL is set from Settings in migrations/env.py. Keeping this empty
# prevents credentials from being committed to the repository.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
